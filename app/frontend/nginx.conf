server {
    listen 80;                                   # Puerto HTTP del contenedor

    location /api/ {                             # Todo lo que empiece con /api/ va a la API
        proxy_pass http://api:5000;              # 'api' es el Service ClusterIP (DNS interno de Kubernetes)
        proxy_set_header Host $host;             # Conserva el Host original
        proxy_connect_timeout 3s;                # Falla rápido si la API no responde
    }

    location / {                                 # El resto son archivos estáticos
        root /usr/share/nginx/html;              # Carpeta con index.html
        index index.html;                        # Archivo por defecto
    }
}
