<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Kubernetes kind - UIS</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; }
    pre  { background: #f4f4f4; padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Aplicación de tres capas</h1>
  <p>Frontend (nginx) &rarr; API (Flask) &rarr; Base de datos (PostgreSQL)</p>
  <button onclick="cargar()">Nueva petición</button>
  <h3>/api/hostname</h3><pre id="host">...</pre>
  <h3>/api/visits</h3><pre id="visitas">...</pre>
  <script>
    async function cargar() {
      for (const [ruta, id] of [["/api/hostname", "host"], ["/api/visits", "visitas"]]) {
        try {
          const r = await fetch(ruta);
          document.getElementById(id).textContent = JSON.stringify(await r.json(), null, 2);
        } catch (e) { document.getElementById(id).textContent = "Error: " + e; }
      }
    }
    cargar();
  </script>
</body>
</html>
